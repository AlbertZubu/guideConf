<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UpTempo — Fiche Excursion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     TOKENS — derived from the Notion design system provided.
     Region colors are CSS custom properties so the whole page
     re-skins instantly when EXCURSION.region changes (see JS).
     ========================================================= */
  :root{
    --ink:#000000; --ink-2:#31302e; --ink-muted:#615d59; --ink-faint:#a39e98;
    --hairline:#e6e6e6;
    --canvas:#ffffff; --canvas-soft:#f6f5f4; --surface:#ffffff;
    --primary:#0075de; --primary-active:#005bab; --secondary:#213183; --on-primary:#ffffff;
    --pulse:#ff64c8; --pulse-ink:#ffffff;
    --buscast:#213183; --buscast-ink:#ffffff;
    --r-xs:4px; --r-sm:5px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-full:9999px;
    --sp-xxs:4px; --sp-xs:8px; --sp-sm:12px; --sp-md:16px; --sp-lg:24px; --sp-xl:28px; --sp-xxl:32px;
    --shadow-1: 0 0.2px 1px rgba(0,0,0,.01), 0 0.8px 3px rgba(0,0,0,.02), 0 2px 8px rgba(0,0,0,.027), 0 4px 18px rgba(0,0,0,.04);
    --toolbar-bg: rgba(255,255,255,.85);
    --font-display:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --region-accent:#62aef0; --region-deep:#0075de; --region-soft:#eaf4fd;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--canvas-soft);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    transition:background-color .4s ease, color .4s ease;
  }
  ::selection{background:var(--region-soft); color:var(--ink);}

  .toolbar, .frame, .pill, .transit, .activity-card, .btn-utility, .design-switcher button{
    transition:background-color .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease;
  }

  /* ---------- Utility bar (screen only) ---------- */
  .toolbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    gap:var(--sp-md); flex-wrap:wrap;
    padding:12px 20px;
    background:var(--toolbar-bg); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--hairline);
  }
  .toolbar > *{min-width:0;}
  .toolbar__hint{font-size:13px; color:var(--ink-muted); line-height:1.4;}
  .toolbar__actions{display:flex; align-items:center; gap:var(--sp-md); flex-wrap:wrap;}
  .btn-utility{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface); color:var(--ink);
    font-family:inherit; font-size:14px; font-weight:500;
    border:1px solid var(--hairline); border-radius:var(--r-md);
    padding:8px 16px; cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .btn-utility:hover{background:var(--canvas-soft);}
  .btn-utility:active{transform:scale(.96);}

  /* ---------- Design switcher ---------- */
  .design-switcher{
    display:inline-flex; align-items:center; gap:2px;
    background:var(--canvas-soft); border:1px solid var(--hairline);
    border-radius:var(--r-full); padding:3px;
  }
  .design-switcher button{
    appearance:none; border:none; cursor:pointer;
    background:transparent; color:var(--ink-muted);
    font-family:var(--font-body); font-size:13px; font-weight:600;
    border-radius:var(--r-full); padding:7px 14px; line-height:1;
  }
  .design-switcher button:hover{color:var(--ink);}
  .design-switcher button.active{
    background:var(--primary); color:var(--on-primary);
    box-shadow:var(--shadow-1);
  }

  /* ---------- Sheet (the "page") ---------- */
  .stage{ padding:40px 16px 80px; }
  .sheet{
    position:relative;
    width:min(1200px, 96vw);
    aspect-ratio:297/210;
    margin:0 auto 40px;
    background:var(--surface);
    border-radius:var(--r-xl);
    box-shadow:var(--shadow-1);
    overflow:hidden;
    padding:44px 52px;
    opacity:0; transform:translateY(14px);
    transition:opacity .6s ease, transform .6s ease, background-color .35s ease, box-shadow .35s ease;
  }
  .sheet.in{opacity:1; transform:translateY(0);}
  .sheet__inner{height:100%; display:flex; flex-direction:column;}

  /* ---------- Shared type ---------- */
  .eyebrow{
    font-size:12px; font-weight:600; letter-spacing:.7px; text-transform:uppercase;
    color:var(--ink-muted);
  }
  .eyebrow.accent{color:var(--region-deep);}
  h1.display{
    font-family:var(--font-display);
    font-size:clamp(34px,4.6vw,58px); font-weight:800; line-height:1.02; letter-spacing:-1.6px;
    margin:6px 0 0;
  }
  h2.heading{
    font-family:var(--font-display);
    font-size:26px; font-weight:700; line-height:1.2; letter-spacing:-.6px; margin:0 0 8px;
  }
  h3.title{ font-family:var(--font-display); font-size:20px; font-weight:600; line-height:1.3; letter-spacing:-.1px; margin:0 0 4px;}
  p.body{ font-size:16px; line-height:1.5; color:var(--ink-2); margin:0 0 10px;}
  p.body:last-child{margin-bottom:0;}
  p.body-sm{ font-size:14.5px; line-height:1.42; color:var(--ink-muted); margin:0 0 6px;}
  .caption{font-size:12.5px; color:var(--ink-faint);}

  /* ---------- Badges / pills ---------- */
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:600; letter-spacing:.4px; text-transform:uppercase;
    border-radius:var(--r-full); padding:5px 12px;
  }
  .pill--region{ background:var(--surface); color:var(--region-deep); border:1px solid var(--region-accent); }
  .pill--buscast{ background:var(--buscast); color:var(--buscast-ink); }
  .pill--pulse{ background:var(--pulse); color:var(--pulse-ink); }
  .pill--plain{ background:var(--canvas-soft); color:var(--ink-2); }

  /* ---------- Logo ---------- */
  .logo{ display:flex; align-items:center; gap:10px; }
  .logo__mark{ display:flex; align-items:flex-end; gap:3px; }
  .logo__mark i{ display:block; width:6px; border-radius:2px 2px 1px 1px; background:var(--primary); }
  .logo__mark i:nth-child(1){height:10px;}
  .logo__mark i:nth-child(2){height:16px; background:var(--region-accent);}
  .logo__mark i:nth-child(3){height:22px;}
  .logo__word{ font-family:var(--font-display); font-size:19px; font-weight:800; letter-spacing:-.4px; line-height:1; }
  .logo__tag{ font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-faint); margin-top:2px; }

  /* ---------- Image frames ---------- */
  .frame{
    position:relative; border-radius:var(--r-lg); overflow:hidden;
    border:1px solid var(--hairline); background:var(--canvas-soft);
  }
  .frame img{ width:100%; height:100%; object-fit:cover; display:block; }
  .frame.img-fallback{
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--region-soft), var(--canvas-soft));
  }
  .frame.img-fallback::after{
    content:attr(data-alt); font-size:12px; color:var(--ink-faint); text-align:center; padding:12px;
  }

  /* ---------- Transit strip ---------- */
  .transit{
    display:flex; align-items:stretch; gap:20px;
    background:var(--canvas-soft); border-radius:var(--r-lg);
    padding:16px 20px; margin-bottom:20px;
  }
  .transit__route{
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    font-size:14.5px; font-weight:600; color:var(--ink-2); white-space:nowrap;
    padding-right:18px; border-right:1px solid var(--hairline);
  }
  .transit__route svg{flex:none;}
  .transit__activities{ display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; }
  .transit__activity{ max-width:340px; }
  .transit__activity .pill{ margin-bottom:6px; }
  .transit__activity .lead{ font-size:14.5px; font-weight:600; margin:0 0 3px; }
  .transit__activity p.body-sm{ margin:0; }

  /* ---------- Destination block ---------- */
  .dest{ display:grid; grid-template-columns:1.25fr 1fr; gap:32px; flex:1; min-height:0; }
  .dest__text{ min-width:0; }
  .dest__media{ display:flex; flex-direction:column; gap:14px; min-height:0; }
  .dest__media .frame{ flex:1; min-height:0; }
  .dest__name{ display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }

  .activity-card{
    background:var(--canvas-soft); border-radius:var(--r-lg); padding:16px 18px; margin:14px 0;
  }
  .activity-card h3.title{ margin-bottom:6px; }

  .lists{ display:flex; gap:22px; margin-top:14px; flex-wrap:wrap; }
  .list-block{ flex:1; min-width:200px; }
  .list-block .eyebrow{ display:block; margin-bottom:8px; }
  .list-item{ display:flex; gap:10px; align-items:flex-start; margin-bottom:8px; }
  .list-item__num{
    flex:none; width:20px; height:20px; border-radius:50%; background:var(--region-accent);
    color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;
    margin-top:2px;
  }
  .list-item__label{ font-size:14.5px; font-weight:600; line-height:1.35; color:var(--ink); }

  .closing-line{
    margin-top:14px; font-size:14.5px; font-style:italic; color:var(--ink-muted);
  }

  /* ---------- Cover ---------- */
  .cover{ display:flex; flex-direction:column; height:100%; }
  .cover__top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .cover__body{ display:grid; grid-template-columns:1.05fr 1fr; gap:36px; align-items:center; flex:1; margin-top:8px; }
  .cover__lede p{ margin:0 0 12px; font-size:16.5px; line-height:1.55; color:var(--ink-2); }
  .cover__duration{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px; }
  .duration-item{ border-top:1px solid var(--hairline); padding-top:8px; }
  .duration-item .eyebrow{ display:block; margin-bottom:3px; }
  .duration-item .value{ font-size:15px; font-weight:600; }
  .cover__media{ height:100%; }
  .cover__media .frame{ height:100%; }

  /* ---------- Closing sheet ---------- */
  .closing-sheet{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; }
  .closing-sheet .route-final{ font-size:22px; font-weight:700; letter-spacing:-.3px; }
  .closing-sheet .divider{ width:56px; height:2px; background:var(--region-accent); border-radius:2px; }
  .contact-grid{ display:flex; gap:34px; margin-top:6px; }
  .contact-grid div{ font-size:14px; color:var(--ink-muted); }
  .contact-grid b{ display:block; color:var(--ink); font-size:14.5px; margin-bottom:2px; }

  /* ---------- Print ---------- */
  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff; }
    .stage{ padding:0; }
    .sheet{
      opacity:1; transform:none; box-shadow:none; border-radius:0;
      width:297mm; height:210mm; aspect-ratio:auto;
      margin:0; page-break-after:always;
    }
    .sheet:last-child{ page-break-after:auto; }
  }
  @page{ size:A4 landscape; margin:0; }

  /* ---------- Responsive (mobile preview) ---------- */
  @media (max-width:860px){
    .sheet{ aspect-ratio:auto; padding:28px 22px; }
    .dest{ grid-template-columns:1fr; }
    .dest__media{ flex-direction:row; }
    .cover__body{ grid-template-columns:1fr; }
    .cover__media{ height:220px; order:-1; }
    .transit{ flex-direction:column; }
    .transit__route{ border-right:none; border-bottom:1px solid var(--hairline); padding:0 0 10px; }
    .contact-grid{ flex-direction:column; gap:12px; }
  }

  @media (prefers-reduced-motion:reduce){
    .sheet{ transition:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

  <div class="toolbar no-print">
    <div class="toolbar__hint">Aperçu du template — chaque carte ci-dessous correspond à une page A4 paysage à l'impression. Photos Wikimedia Commons à titre d'exemple : à remplacer par vos visuels avant diffusion.</div>
    <div class="toolbar__actions">
      <div class="design-switcher" id="designSwitcher" role="group" aria-label="Design system">
        <button type="button" data-design="notion">Notion</button>
        <button type="button" data-design="claude">Claude</button>
        <button type="button" data-design="discord">Discord</button>
      </div>
      <button class="btn-utility" onclick="window.print()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>
        Imprimer / PDF
      </button>
    </div>
  </div>

  <div class="stage" id="stage"></div>

<script>
/* =============================================================
   DESIGN SYSTEMS — token sets lifted from real brand design-system
   analyses (see Design styles.zip). Add a new key here to add a
   new switcher option; nothing else in the page needs to change.
   Layout spacing (--sp-*) stays constant across systems so adding
   a system never risks breaking the grid — only color, radius,
   shadow and typography tokens are swapped.
   ============================================================= */
const DESIGN_SYSTEMS = {
  notion: {
    label:"Notion",
    "--ink":"#000000", "--ink-2":"#31302e", "--ink-muted":"#615d59", "--ink-faint":"#a39e98",
    "--hairline":"#e6e6e6",
    "--canvas":"#ffffff", "--canvas-soft":"#f6f5f4", "--surface":"#ffffff",
    "--primary":"#0075de", "--primary-active":"#005bab", "--secondary":"#213183", "--on-primary":"#ffffff",
    "--pulse":"#ff64c8", "--pulse-ink":"#ffffff",
    "--buscast":"#213183", "--buscast-ink":"#ffffff",
    "--r-xs":"4px", "--r-sm":"5px", "--r-md":"8px", "--r-lg":"12px", "--r-xl":"16px", "--r-full":"9999px",
    "--shadow-1":"0 0.2px 1px rgba(0,0,0,.01), 0 0.8px 3px rgba(0,0,0,.02), 0 2px 8px rgba(0,0,0,.027), 0 4px 18px rgba(0,0,0,.04)",
    "--toolbar-bg":"rgba(255,255,255,.85)",
    "--font-display":"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",
    "--font-body":"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",
  },
  claude: {
    label:"Claude",
    "--ink":"#141413", "--ink-2":"#3d3d3a", "--ink-muted":"#6c6a64", "--ink-faint":"#8e8b82",
    "--hairline":"#e6dfd8",
    "--canvas":"#faf9f5", "--canvas-soft":"#f5f0e8", "--surface":"#efe9de",
    "--primary":"#cc785c", "--primary-active":"#a9583e", "--secondary":"#181715", "--on-primary":"#ffffff",
    "--pulse":"#e8a55a", "--pulse-ink":"#141413",
    "--buscast":"#5db8a6", "--buscast-ink":"#141413",
    "--r-xs":"4px", "--r-sm":"6px", "--r-md":"8px", "--r-lg":"12px", "--r-xl":"16px", "--r-full":"9999px",
    "--shadow-1":"0 1px 2px rgba(20,20,19,.04), 0 4px 12px rgba(20,20,19,.06), 0 12px 32px rgba(20,20,19,.08)",
    "--toolbar-bg":"rgba(250,249,245,.88)",
    "--font-display":"'Fraunces',Georgia,serif",
    "--font-body":"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",
  },
  discord: {
    label:"Discord",
    "--ink":"#ffffff", "--ink-2":"#dfe1fb", "--ink-muted":"#9aa0e8", "--ink-faint":"#6b70b0",
    "--hairline":"rgba(255,255,255,.14)",
    "--canvas":"#0a0d3a", "--canvas-soft":"#1e2353", "--surface":"#1e2353",
    "--primary":"#5865f2", "--primary-active":"#4752c4", "--secondary":"#23272a", "--on-primary":"#ffffff",
    "--pulse":"#ec48bd", "--pulse-ink":"#ffffff",
    "--buscast":"#35ed7e", "--buscast-ink":"#08130c",
    "--r-xs":"6px", "--r-sm":"12px", "--r-md":"14px", "--r-lg":"16px", "--r-xl":"28px", "--r-full":"9999px",
    "--shadow-1":"0 0 0 1px rgba(88,101,242,.25), 0 8px 24px rgba(88,101,242,.35), 0 2px 8px rgba(0,0,0,.4)",
    "--toolbar-bg":"rgba(10,13,58,.8)",
    "--font-display":"'Unbounded',-apple-system,BlinkMacSystemFont,sans-serif",
    "--font-body":"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",
  },
};

function applyDesign(key){
  const tokens = DESIGN_SYSTEMS[key];
  if(!tokens) return;
  const root = document.documentElement.style;
  Object.keys(tokens).forEach(prop => {
    if(prop.startsWith('--')) root.setProperty(prop, tokens[prop]);
  });
  document.querySelectorAll('#designSwitcher button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.design === key);
  });
  try{ localStorage.setItem('uptempo-design', key); }catch(e){}
}

document.querySelectorAll('#designSwitcher button').forEach(btn => {
  btn.addEventListener('click', () => applyDesign(btn.dataset.design));
});

let savedDesign = 'notion';
try{ savedDesign = localStorage.getItem('uptempo-design') || 'notion'; }catch(e){}
applyDesign(DESIGN_SYSTEMS[savedDesign] ? savedDesign : 'notion');

/* =============================================================
   REGION SYSTEM — reused across every excursion in the catalog.
   Add a region key here once; every future sheet just points
   EXCURSION.region at one of these to re-skin automatically.
   ============================================================= */
const REGIONS = {
  normandie: { label:"Normandie",                 accent:"#62aef0", deep:"#0075de", soft:"#eaf4fd" },
  bretagne:  { label:"Bretagne",                  accent:"#5ec2be", deep:"#1f7d79", soft:"#e7f5f4" },
  provence:  { label:"Provence & Côte d'Azur",    accent:"#ef8a4a", deep:"#b0470a", soft:"#fdece0" },
  loire:     { label:"Vallée de la Loire",        accent:"#4dc06a", deep:"#0f7a28", soft:"#e8f8ec" },
  idf:       { label:"Île-de-France",             accent:"#a97fe0", deep:"#391c57", soft:"#f2e9fb" },
};

/* =============================================================
   EXCURSION DATA — the ONLY section to edit for a new sheet.
   Text is reproduced verbatim from the source itinerary; do not
   paraphrase when adapting for another trip unless intended.
   Image slots take any direct image URL (Wikimedia Special:FilePath
   links are hotlink-safe and a good free default).
   ============================================================= */

  region: "normandie",

  sheets: [

        ],

          "Rouen provides an exceptional setting for understanding medieval Normandy.",

    },

    { type:"transit-destination",
      day:1,
      transit:{
        route:"Bus — Rouen to Omaha",
        activities:[
          { format:"BUSCAST", title:"Letter to a Soldier", paragraphs:[
            "An exploration of letters and personal correspondence written by people directly affected by the war, including soldiers, relatives and civilians.",
            "Their words provide an intimate and immediate perspective on the conflict, helping students understand not only what happened, but also how individuals experienced uncertainty, separation, fear and hope."
          ]},
        ]
      },
      destination:{
        name:"Omaha — Landscapes of War",
        images:[
          { src:"https://commons.wikimedia.org/wiki/Special:FilePath/Normandy_American_Cemetery_and_Memorial_%287937936%29.jpg", alt:"Normandy American Cemetery" },
          { src:"https://commons.wikimedia.org/wiki/Special:FilePath/Omaha_Beach%2C_Normandy_%2835289899794%29.jpg", alt:"Omaha Beach" },
        ],
        intro:[
          "Students explore the landscapes of the Normandy landings and discover how beaches, villages, memorials and cemeteries have become places where military history, personal memories and present-day life coexist.",
          "The experience examines how local communities rebuilt their lives while preserving the physical traces, personal stories and collective memories of the conflict."
        ],

/* =============================================================
   RENDER
   ============================================================= */
const stage = document.getElementById('stage');
const region = REGIONS[EXCURSION.region];
document.documentElement.style.setProperty('--region-accent', region.accent);
document.documentElement.style.setProperty('--region-deep', region.deep);
document.documentElement.style.setProperty('--region-soft', region.soft);

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }

function frame(images, opts={}){
  const list = Array.isArray(images) ? images : [images];
  return list.map(im => `
    <div class="frame" style="${opts.style||''}" data-alt="${im.alt}">
      <img src="${im.src}" alt="${im.alt}" loading="lazy"
           onerror="this.parentElement.classList.add('img-fallback'); this.remove();">
    </div>`).join('');
}

function pillFor(format){
  if(format === 'BUSCAST') return `<span class="pill pill--buscast">BusCast</span>`;
  if(format === 'Pulse') return `<span class="pill pill--pulse">Pulse</span>`;
  return '';
}

function routeIcon(){
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6v6M16 6v6M2 12h19.6M18 18h2a1 1 0 0 0 1-1v-3.34a1 1 0 0 0-.4-.8L18 9.5"/><rect x="1" y="6" width="15" height="12" rx="2"/><circle cx="6" cy="18" r="2"/><circle cx="15" cy="18" r="2"/></svg>`;
}

function renderTransit(t){
  if(!t) return '';
  return `
    <div class="transit">
      <div class="transit__route">${routeIcon()} ${t.route}</div>
      <div class="transit__activities">
        ${t.activities.map(a => `
          <div class="transit__activity">
            ${pillFor(a.format)}
            <div class="lead">${a.title}</div>
            <p class="body-sm">${a.paragraphs[0]}</p>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function renderLists(lists){
  if(!lists) return '';
  return `<div class="lists">${lists.map(l => `
    <div class="list-block">
      <span class="eyebrow accent">${l.heading}</span>
      ${l.items.map((it,i) => `
        <div class="list-item">
          <span class="list-item__num">${i+1}</span>
          <span class="list-item__label">${it}</span>
        </div>`).join('')}
    </div>`).join('')}</div>`;
}

function renderActivity(a){
  if(!a) return '';
  return `
    <div class="activity-card">
      ${pillFor(a.format)}
      <h3 class="title" style="margin-top:6px;">${a.title}</h3>
      ${a.paragraphs.map(p => `<p class="body">${p}</p>`).join('')}
    </div>`;
}

function renderDestination(d){
  return `
    <div class="dest">
      <div class="dest__text">
        <div class="dest__name"><h2 class="heading">${d.name}</h2></div>
        ${d.intro.map(p => `<p class="body">${p}</p>`).join('')}
        ${renderActivity(d.activity)}
        ${renderLists(d.lists)}
        ${d.closing ? `<div class="closing-line">${d.closing}</div>` : ''}
        ${d.extra ? `
          <div style="margin-top:16px;">
            <h3 class="title">${d.extra.title}</h3>
            ${d.extra.paragraphs.map(p => `<p class="body-sm">${p}</p>`).join('')}
          </div>` : ''}
      </div>
      <div class="dest__media">${frame(d.images)}</div>
    </div>`;
}

function renderLogo(size='normal'){
  const big = size === 'big';
  return `
    <div class="logo">
      <div class="logo__mark"><i></i><i></i><i></i></div>
      <div>
        <div class="logo__word" style="${big?'font-size:24px':''}">UpTempo</div>
        <div class="logo__tag">Cultural Journeys</div>
      </div>
    </div>`;
}

function renderCover(){
  const sheet = el(`<section class="sheet"><div class="sheet__inner cover"></div></section>`);
  sheet.querySelector('.cover').innerHTML = `
    <div class="cover__top">
      ${renderLogo('big')}
      <span class="pill pill--region">${region.label}</span>
    </div>
    <div class="cover__body">
      <div>
        <span class="eyebrow accent">2-Day Educational Journey</span>
        <h1 class="display">${EXCURSION.title}</h1>
        <div class="cover__lede">${EXCURSION.lede.map(p=>`<p>${p}</p>`).join('')}</div>
        <div class="cover__duration">
          ${EXCURSION.duration.map(d => `
            <div class="duration-item">
              <span class="eyebrow">${d.label}</span>
              <div class="value">${d.value}</div>
            </div>`).join('')}
        </div>
      </div>
      <div class="cover__media">${frame({src:EXCURSION.coverImage, alt:'Normandy coastline'})}</div>
    </div>`;
  return sheet;
}

function renderDaySheet(s){
  const sheet = el(`<section class="sheet"><div class="sheet__inner"></div></section>`);
  const eyebrow = s.day ? `<span class="eyebrow accent">Day ${s.day}</span>` : '';
  sheet.querySelector('.sheet__inner').innerHTML = `
    ${eyebrow}
    <div style="margin-top:6px; flex:1; display:flex; flex-direction:column; min-height:0;">
      ${renderTransit(s.transit)}
      ${renderDestination(s.destination)}
    </div>`;
  return sheet;
}

function renderClosing(){
  const c = EXCURSION.closing;
  const sheet = el(`<section class="sheet"><div class="sheet__inner closing-sheet"></div></section>`);
  sheet.querySelector('.closing-sheet').innerHTML = `
    ${renderLogo('big')}
    <div class="divider"></div>
    <div class="route-final">${c.route}</div>
    <p class="body" style="max-width:520px; color:var(--ink-muted);">
      Thank you for travelling with UpTempo. This document was prepared for your ${region.label} programme
      — get in touch for dates, availability or a tailored version of this journey.
    </p>
    <div class="contact-grid">
      ${c.contact.map(x => `<div><b>${x.label}</b>${x.value}</div>`).join('')}
    </div>
  `;
  return sheet;
}

stage.appendChild(renderCover());
EXCURSION.sheets.forEach(s => stage.appendChild(renderDaySheet(s)));
stage.appendChild(renderClosing());

/* Reveal-on-scroll (respects reduced motion via CSS above) */
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
}, { threshold:0.1 });
document.querySelectorAll('.sheet').forEach(s=>io.observe(s));
</script>
</body>
</html>
