<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UpTempo — Fiche excursion : référence et 6 variations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { font-family: 'Inter', sans-serif; }

/* Barre de navigation horizontale, fixe, toujours visible — permet de
   naviguer d'une variation à l'autre sans recharger toute la page (seul
   le cadre du bas change). */
.switcher {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 52px;
  z-index: 999999;
  display: flex;
  align-items: center;
  gap: .35rem;
  padding: 0 .75rem;
  background: #14171c;
  border-bottom: 1px solid rgba(255,255,255,.08);
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: thin;
}
.switcher .brand {
  color: #ffffff;
  font-weight: 700;
  font-size: .85rem;
  padding-right: .6rem;
  margin-right: .3rem;
  border-right: 1px solid rgba(255,255,255,.15);
  flex-shrink: 0;
}
.switcher button {
  flex-shrink: 0;
  font-family: 'Inter', sans-serif;
  font-size: .78rem;
  font-weight: 600;
  color: #b7bcc4;
  background: transparent;
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 999px;
  padding: .4rem .8rem;
  cursor: pointer;
  transition: all .15s ease;
}
.switcher button:hover { color: #ffffff; border-color: rgba(255,255,255,.35); }
.switcher button.active {
  background: #ffffff;
  color: #14171c;
  border-color: #ffffff;
}
/* La référence garde un repère visuel : c'est elle qu'on compare aux autres. */
.switcher button.is-reference { border-color: rgba(255,255,255,.4); color: #ffffff; }
.switcher button.is-reference.active { color: #14171c; }
.switcher .sep {
  width: 1px; height: 22px; flex-shrink: 0;
  background: rgba(255,255,255,.15);
  margin: 0 .35rem;
}

main {
  position: fixed;
  top: 52px; left: 0; right: 0; bottom: 0;
}
main iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
</style>
</head>
<body>

<nav class="switcher no-print" id="switcher">
  <span class="brand">UpTempo</span>
</nav>

<main>
  <iframe id="frame" title="Aperçu de la variation sélectionnée"></iframe>
</main>

<script>
/* Une seule fiche (fiche.html), une feuille de style par variation.
   `reference` est le design de départ — le Nike retravaillé ; les six
   suivantes reprennent chacune un ingrédient retenu sur les anciens
   styles (bordure gauche, bandeau, portraits, trame, noir adouci,
   organisation en tuiles). */
const DESIGNS = [
  { key: "reference", label: "Référence", reference: true },
  { key: "rule",      label: "1 · Rule" },
  { key: "banner",    label: "2 · Banner" },
  { key: "portrait",  label: "3 · Portrait" },
  { key: "pattern",   label: "4 · Pattern" },
  { key: "ink",       label: "5 · Ink" },
  { key: "bento",     label: "6 · Bento" },
];

const STORAGE_KEY = "uptempo-design-gallery-active";
const nav = document.getElementById("switcher");
const frame = document.getElementById("frame");

DESIGNS.forEach((d, i) => {
  if (i === 1) nav.appendChild(Object.assign(document.createElement("span"), { className: "sep" }));
  const btn = document.createElement("button");
  btn.textContent = d.label;
  btn.dataset.key = d.key;
  if (d.reference) btn.classList.add("is-reference");
  btn.addEventListener("click", () => selectDesign(d.key));
  nav.appendChild(btn);
});

function selectDesign(key) {
  frame.src = `fiche.html?style=${key}`;
  nav.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.key === key));
  window.localStorage.setItem(STORAGE_KEY, key);
}

const saved = window.localStorage.getItem(STORAGE_KEY);
const initial = DESIGNS.some((d) => d.key === saved) ? saved : "reference";
selectDesign(initial);
</script>

</body>
</html>
